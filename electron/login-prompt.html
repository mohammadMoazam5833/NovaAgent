<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dorj Agent Client — Sign in</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0B1B3A;
        --fg: #E8EEFB;
        --muted: rgba(226,232,245,.65);
        --accent: #1E3A8A;
        --border: rgba(180,198,236,.16);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(440px, 100%);
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.45;
        font-size: 0.95rem;
      }
      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 6px;
        color: var(--muted);
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0F2652;
        color: var(--fg);
        font-size: 0.95rem;
        margin-bottom: 12px;
      }
      input:focus {
        outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
        border-color: var(--accent);
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        justify-content: flex-end;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 0.95rem;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
      }
      button.primary:disabled {
        opacity: 0.6;
        cursor: default;
      }
      button.ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
      }
      .error {
        color: #ff8b8b;
        font-size: 0.85rem;
        min-height: 1.2em;
        margin-top: 8px;
      }
    </style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='8' width='48' height='48' rx='14' fill='%230a0d13'/%3E%3Cpath d='M20 44V20L44 44V20' fill='none' stroke='%23eef1f6' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='44' cy='18' r='3.5' fill='%23e0805f'/%3E%3C/svg%3E">
</head>
  <body>
    <main>
      <h1>Sign in to Dorj Agent</h1>
      <p>
        Enter the username and password you received from your administrator.
        The app connects to the company server automatically after signing in.
      </p>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" autofocus />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <div class="error" id="error" aria-live="polite"></div>
      <div class="actions">
        <button type="button" class="ghost" id="quit">Quit</button>
        <button type="button" class="primary" id="save">Sign in</button>
      </div>
    </main>
    <script>
      const { ipcRenderer } = require("electron");
      const username = document.getElementById("username");
      const password = document.getElementById("password");
      const error = document.getElementById("error");
      document.getElementById("quit").onclick = () => {
        ipcRenderer.send("thin-login-prompt", { action: "quit" });
      };
      document.getElementById("save").onclick = () => {
        const u = username.value.trim();
        const p = password.value;
        if (!u || !p) {
          error.textContent = "Enter your username and password.";
          return;
        }
        error.textContent = "";
        ipcRenderer.send("thin-login-prompt", {
          action: "save",
          username: u,
          password: p,
        });
      };
      for (const el of [username, password]) {
        el.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter") document.getElementById("save").click();
        });
      }
    </script>
  </body>
</html>
