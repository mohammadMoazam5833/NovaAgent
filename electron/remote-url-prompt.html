<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dorj Agent Client — server URL</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0B1B3A;
        --fg: #E8EEFB;
        --muted: rgba(226,232,245,.65);
        --accent: #1E3A8A;
        --border: rgba(180,198,236,.16);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(440px, 100%);
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.45;
        font-size: 0.95rem;
      }
      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 6px;
        color: var(--muted);
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0F2652;
        color: var(--fg);
        font-size: 0.95rem;
      }
      input:focus {
        outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
        border-color: var(--accent);
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
        justify-content: flex-end;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 0.95rem;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
      }
      button.ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
      }
      .error {
        color: #ff8b8b;
        font-size: 0.85rem;
        min-height: 1.2em;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect to your Dorj Agent server</h1>
      <p>
        This Client does not run an agent on your PC. Enter the company server
        URL (HTTPS recommended), then continue. You will paste the session API
        key on the next screen if the server uses public mode.
      </p>
      <label for="url">Server URL</label>
      <input
        id="url"
        type="url"
        placeholder="https://nova.example.com"
        autocomplete="url"
        autofocus
      />
      <div class="error" id="error" aria-live="polite"></div>
      <div class="actions">
        <button type="button" class="ghost" id="quit">Quit</button>
        <button type="button" class="primary" id="save">Continue</button>
      </div>
    </main>
    <script>
      const { ipcRenderer } = require("electron");
      const input = document.getElementById("url");
      const error = document.getElementById("error");
      document.getElementById("quit").onclick = () => {
        ipcRenderer.send("thin-remote-url-prompt", { action: "quit" });
      };
      document.getElementById("save").onclick = () => {
        const value = input.value.trim();
        if (!value) {
          error.textContent = "Enter a server URL.";
          return;
        }
        try {
          const u = new URL(value);
          if (u.protocol !== "http:" && u.protocol !== "https:") {
            throw new Error("Use http:// or https://");
          }
        } catch (e) {
          error.textContent = e.message || "Invalid URL.";
          return;
        }
        error.textContent = "";
        ipcRenderer.send("thin-remote-url-prompt", {
          action: "save",
          url: value,
        });
      };
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") document.getElementById("save").click();
      });
    </script>
  </body>
</html>
